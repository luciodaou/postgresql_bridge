<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundo Fixo – CTO-FF</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --fg:#242424; --muted:#6b6f76; --line:#e3e5e8;
  --accent:#118DFF; --accent-soft:#e6f2ff; --warn:#f0e199; --over:#c4314b; --over-soft:#fde7ea;
  --ok:#00A41B; --hh:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:13px/1.4 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--fg);background:var(--bg)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:600;white-space:nowrap}
header .grow{flex:1}
select,input,button{font:inherit}
select,input[type=text]{padding:5px 8px;border:1px solid #c8ccd1;border-radius:4px;background:#fff;max-width:100%}
button{padding:5px 10px;border:1px solid #c8ccd1;border-radius:4px;background:#fff;cursor:pointer;touch-action:manipulation}
button:hover{background:#f0f2f4}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#0b7ae0}
#status{font-size:12px;color:var(--muted);min-width:0}
#status.err{color:var(--over)}
nav{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:var(--hh);z-index:5}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:none;border-bottom:3px solid transparent;border-radius:0;padding:9px 14px;background:none;white-space:nowrap;color:var(--muted)}
nav button.active{border-bottom-color:var(--accent);color:var(--fg);font-weight:600}
main{padding:14px 16px;max-width:1680px;margin:0 auto}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px;min-width:0}
.card h2{font-size:14px;margin:0 0 8px;font-weight:600}
.row{display:flex;gap:12px;align-items:flex-start}
.row>.card{flex:1 1 0;min-width:0}
.row>.card.side{flex:0 0 230px}
.row>.card.side.wide{flex-basis:360px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-bottom:12px}
.grid3>.card{margin:0}
/* Slicers */
.slicer{display:flex;flex-wrap:wrap;gap:6px}
.slicer button,.months button{min-width:64px;padding:6px 10px;border-left:4px solid #c8ccd1;white-space:nowrap}
.slicer button.on,.months button.on{border-color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.slicer.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.slicer.grid button{min-width:0}
/* faixa de meses: ordem cronológica, rola na horizontal */
.months{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;position:relative;scrollbar-width:thin}
.months button{flex:0 0 auto}
.months:empty{display:none}
/* Gráficos: largura do contêiner; rolagem horizontal quando há muitas categorias */
.chart{width:100%;overflow-x:auto;overflow-y:hidden}
.chart svg{display:block;max-width:none}
.chart svg.fluid{width:100%;height:auto;max-width:420px;margin:auto}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.dash{height:0;border-top:3px dashed #555;border-radius:0;width:16px;vertical-align:3px}
/* Tabelas */
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;border-bottom:1px solid #eef0f2;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#fafbfc;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;z-index:1}
th.sorted::after{content:" ▾"}th.sorted.asc::after{content:" ▴"}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.ctr,th.ctr{text-align:center}
td.nowrap{white-space:nowrap}
tr.total td{font-weight:700;background:#fafbfc;position:sticky;bottom:0}
tbody tr:hover td{background:#f7f9fb}
td.warn{background:var(--warn) !important}
td.over{color:var(--over);font-weight:600}
td.lim{background:#D6EBFF}
td.tot{background:#D9FFD8}
td.uso{background:#ccd2f7}
.mono td{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px}
/* primeira coluna fixa ao rolar a matriz na horizontal */
.sticky-first td:first-child,.sticky-first th:first-child{position:sticky;left:0;background:var(--card);box-shadow:1px 0 0 var(--line)}
.sticky-first th:first-child{z-index:3;background:#fafbfc}
.sticky-first tr.total td:first-child{background:#fafbfc;z-index:2}
.toolbar{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.toolbar input{flex:1 1 220px;max-width:360px}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
#cfg{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:#fffbe6;border-bottom:1px solid var(--line)}
#cfg.show{display:flex}
#cfg label{font-size:12px;color:var(--muted)}
#cfg input[type=text]{width:min(330px,100%)}
.tip{position:fixed;pointer-events:none;background:#242424;color:#fff;padding:5px 8px;border-radius:4px;font-size:12px;display:none;z-index:20;white-space:nowrap}
@media (max-width:900px){
  .row{flex-direction:column;align-items:stretch}
  .row>.card.side,.row>.card.side.wide{flex:none}
  .row>.card.side:not(.wide){order:-1}
  .side .slicer.grid{display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .side .slicer.grid button{flex:0 0 auto}
}
@media (max-width:600px){
  header{position:static;padding:8px 10px;gap:6px 8px}
  header h1{font-size:15px}
  #status{order:10;flex-basis:100%}
  nav{top:0;padding:0 6px}
  nav button{padding:9px 10px}
  main{padding:10px}
  .card{padding:10px;margin-bottom:10px}
  #cfg{padding:8px 10px}
  .tbl-wrap{max-height:65vh}
}
</style>
</head>
<body>
<header>
  <h1>Fundo Fixo – CTO-FF</h1>
  <label>Ano <select id="yearSel"></select></label>
  <button class="primary" id="btnReload" title="Buscar dados novamente na fonte">↻ Atualizar</button>
  <span id="status">Carregando…</span>
  <span class="grow"></span>
  <button id="btnCfg" title="Fonte de dados">⚙ Fonte</button>
</header>
<div id="cfg">
  <label>Endpoint CSV</label>
  <input type="text" id="cfgApi">
  <label>Banco</label>
  <input type="text" id="cfgDb" style="width:130px">
  <button id="cfgSave">Salvar e recarregar</button>
  <span class="muted">ou carregar arquivos CSV:</span>
  <label>v_cto_ff <input type="file" id="fileCto" accept=".csv,text/csv"></label>
  <label>dataref_ud <input type="file" id="fileUd" accept=".csv,text/csv"></label>
</div>
<nav id="tabs"></nav>
<main>
  <section class="page" data-title="Gasto Mensal (R$)" id="pg-gasto">
    <div class="card">
      <h2>Valor Mensal por UD e Tipo (R$)</h2>
      <div class="months" id="slGasto"></div>
      <div class="chart" id="chGasto"></div><div class="legend" id="lgGasto"></div>
    </div>
  </section>

  <section class="page" data-title="Valores" id="pg-valores">
    <div class="row">
      <div class="card"><h2>Valor (R$) por Mês de Competência</h2><div class="chart" id="chValores"></div><div class="legend" id="lgValores"></div></div>
      <div class="card side"><h2>UD</h2><div class="slicer grid" id="slValoresUd"></div></div>
    </div>
  </section>

  <section class="page" data-title="Descrição" id="pg-desc">
    <div class="row">
      <div class="card">
        <div class="months" id="slDesc"></div>
        <div class="tbl-wrap" id="tbDesc"></div>
      </div>
      <div class="card side"><h2>UD</h2><div class="slicer grid" id="slDescUd"></div></div>
    </div>
  </section>

  <section class="page" data-title="Acima do Limite" id="pg-limite">
    <div class="row">
      <div class="card"><h2>Meses acima do limite</h2><div class="tbl-wrap" id="tbLista"></div></div>
      <div class="card side wide"><h2>Resumo por UD</h2><div class="tbl-wrap" id="tbResumo"></div></div>
    </div>
  </section>

  <section class="page" data-title="Tabela de Dados" id="pg-dados">
    <div class="card">
      <div class="toolbar"><input type="text" id="qDados" placeholder="Filtrar (qualquer coluna)…"><span class="muted" id="cntDados"></span></div>
      <div class="tbl-wrap" id="tbDados"></div>
    </div>
  </section>

  <section class="page" data-title="Matriz Uso" id="pg-matriz">
    <div class="card"><div class="tbl-wrap mono sticky-first" id="tbMatriz"></div></div>
  </section>

  <section class="page" data-title="Painel" id="pg-painel">
    <div class="card"><div class="months" id="slPainel" style="margin-bottom:0"></div></div>
    <div class="grid3">
      <div class="card"><h2>Consumo Fundo Fixo</h2><div class="chart" id="chGauge"></div></div>
      <div class="card"><h2>Lançamentos no mês</h2><div class="chart" id="chGauge2"></div></div>
      <div class="card"><h2>Valor por Tipo</h2><div class="chart" id="chPie"></div><div class="legend" id="lgPie"></div></div>
    </div>
  </section>
</main>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* ================= Configuração ================= */
const DEFAULTS = {
  api: "/csv",  // same origin: served by the cto-ff-web container
  db: "db_despesas",
  sqlCto: "SELECT * FROM v_cto_ff",
  sqlUd: "SELECT * FROM dataref_ud"
};
const qs = new URLSearchParams(location.search);
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
// SQL is fixed in the page (not overridable via URL/storage); only endpoint and database are configurable
function cfgGet(k){ return (k === "api" || k === "db") ? (qs.get(k) || lsGet("ffcto_"+k) || DEFAULTS[k]) : DEFAULTS[k]; }
function cfgSet(k,v){ try{ localStorage.setItem("ffcto_"+k,v); }catch(e){} }

const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES_ABR = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const PALETTE = ["#118DFF","#12239E","#E66C37","#6B007B","#E044A7","#744EC2","#D9B300","#D64550","#197278","#1AAB40"];
const fmtBRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const fmtNum = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtNum1 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtPct = new Intl.NumberFormat("pt-BR",{style:"percent",minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").trim().toLowerCase();

/* ================= Estado ================= */
const S = {
  rows: [], limits: new Map(), uds: [], tipos: [], years: [],
  year: null, page: lsGet("ffcto_page") || "pg-gasto",
  mGasto: null, mPainel: null, mDesc: null, udValores: null, udDesc: new Set(),
  sort: {}
};

/* ================= CSV ================= */
function parseCSV(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const out = []; let row = [], f = "", q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(f); f = ""; if (row.length > 1 || row[0] !== "") out.push(row); row = [];
    } else f += c;
  }
  if (f !== "" || row.length){ row.push(f); out.push(row); }
  if (!out.length) return [];
  const h = out[0].map(x => x.trim());
  return out.slice(1).map(r => Object.fromEntries(h.map((k,i) => [k, r[i] ?? ""])));
}
const toNum = v => { if (v == null || v === "") return null; let s = String(v).trim();
  if (/^-?\d{1,3}(\.\d{3})*,\d+$/.test(s) || (/,/.test(s) && !/\./.test(s))) s = s.replace(/\./g,"").replace(",","."); const n = Number(s); return isFinite(n) ? n : null; };

/* ================= Carga ================= */
async function fetchCSV(sql){
  const url = cfgGet("api") + "?db=" + encodeURIComponent(cfgGet("db")) + "&sql=" + encodeURIComponent(sql);
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok){ const body = (await r.text().catch(() => "")).replace(/^﻿/,"").trim().slice(0,300);
    throw new Error("HTTP " + r.status + " em " + sql + (body ? " — " + body : "")); }
  return parseCSV(await r.text());
}
function compToMonth(comp, data){
  // "Maio/2026" -> {y:2026,m:5}; fallback para a data do lançamento
  const m = /^\s*([^\/\-\s]+)\s*[\/\-]\s*(\d{4})/.exec(comp || "");
  if (m){
    const n = norm(m[1]); let idx = MESES.findIndex(x => norm(x) === n);
    if (idx < 0) idx = MES_ABR.findIndex(x => n.startsWith(x));
    if (idx < 0 && /^\d{1,2}$/.test(n)) idx = +n - 1;
    if (idx >= 0) return {y:+m[2], m:idx+1};
  }
  const d = /^(\d{4})-(\d{2})/.exec(data || "");
  return d ? {y:+d[1], m:+d[2]} : null;
}
function ingest(ctoRows, udRows){
  S.rows = ctoRows.map(r => {
    const cm = compToMonth(r.competencia, r.data);
    return {
      cto:r.cto, run_id:r.run_id, data:r.data, ud:(r.ud||"").trim(), dependencia:r.dependencia,
      num_daffc:r.num_daffc, razao_social:r.razao_social, cnpj:r.cnpj, nota_fiscal_num:r.nota_fiscal_num,
      competencia:r.competencia, valor: toNum(r.valor) || 0, tipo:(r.tipo||"").trim() || "(vazio)",
      descricao_sucinta:r.descricao_sucinta, id_arq:r.id_arq,
      y: cm ? cm.y : null, m: cm ? cm.m : null, ym: cm ? cm.y*100 + cm.m : null
    };
  });
  S.limits = new Map();
  for (const r of udRows || []){
    const keys = Object.keys(r); const kUd = keys.find(k => norm(k) === "ud"); const kL = keys.find(k => norm(k) === "limite");
    if (!kUd) continue;
    const u = (r[kUd]||"").trim(); if (!u) continue;
    S.limits.set(u, kL ? toNum(r[kL]) : null);
  }
  const udSet = new Set([...S.limits.keys(), ...S.rows.map(r => r.ud).filter(Boolean)]);
  S.uds = [...udSet].sort((a,b) => a.localeCompare(b,"pt-BR"));
  const tc = {}; for (const r of S.rows) tc[r.tipo] = (tc[r.tipo]||0) + r.valor;
  S.tipos = Object.keys(tc).sort((a,b) => tc[b]-tc[a]);
  S.years = [...new Set(S.rows.map(r => r.y).filter(Boolean))].sort((a,b) => a-b);
  const cur = new Date().getFullYear();
  if (!S.years.includes(S.year)) S.year = S.years.includes(cur) ? cur : S.years[S.years.length-1] ?? cur;
  const ys = document.getElementById("yearSel");
  ys.innerHTML = (S.years.length ? S.years : [S.year]).map(y => `<option ${y===S.year?"selected":""}>${y}</option>`).join("");
  resetMonths();
  render();
}
function resetMonths(){
  const ms = monthsOfYear(); const last = ms[ms.length-1] ?? null;
  // mês corrente se existir no ano selecionado, senão o último com dados
  const now = new Date(); const curYm = now.getFullYear()*100 + now.getMonth()+1;
  const def = ms.includes(curYm) ? curYm : last;
  S.mGasto = def; S.mPainel = def; S.mDesc = null;
}
async function load(){
  setStatus("Carregando dados…");
  try{
    const [cto, ud] = await Promise.all([
      fetchCSV(cfgGet("sqlCto")),
      fetchCSV(cfgGet("sqlUd")).catch(e => { console.warn(e); return null; })
    ]);
    ingest(cto, ud || []);
    const t = new Date().toLocaleString("pt-BR");
    setStatus(`${S.rows.length} lançamentos · ${S.limits.size} UDs com limite · atualizado ${t}` + (ud ? "" : " · ⚠ limites (dataref_ud) indisponíveis"), !ud);
  }catch(e){
    console.error(e);
    setStatus("Falha ao buscar dados: " + e.message + " — verifique ⚙ Fonte (CORS/endereço) ou carregue os CSVs.", true);
    document.getElementById("cfg").classList.add("show");
  }
}
function setStatus(t, err){ const s = document.getElementById("status"); s.textContent = t; s.className = err ? "err" : ""; setHeaderH(); }
// altura real do cabeçalho (varia quando quebra linha) para a barra de abas grudar logo abaixo
function setHeaderH(){ document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px"); }

/* ================= Helpers de dados ================= */
const yearRows = () => S.rows.filter(r => r.y === S.year);
function monthsOfYear(){ return [...new Set(yearRows().map(r => r.ym))].sort((a,b) => a-b); }
const ymLabel = ym => MES_ABR[ym%100-1] + "/" + String(Math.floor(ym/100)).slice(-2);
const ymLong = ym => { const s = MESES[ym%100-1]; return s[0].toUpperCase()+s.slice(1) + "/" + Math.floor(ym/100); };
const lim = ud => S.limits.get(ud);
function sumBy(rows, keyFn){ const m = new Map(); for (const r of rows){ const k = keyFn(r); m.set(k, (m.get(k)||0) + r.valor); } return m; }
const tipoColor = t => PALETTE[S.tipos.indexOf(t) % PALETTE.length];

/* ================= Tooltip ================= */
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t){ tip.style.display = "none"; return; }
  tip.innerHTML = t.getAttribute("data-tip"); tip.style.display = "block";
  const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(e.clientX + 12, innerWidth - w - 8)) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
addEventListener("scroll", () => { tip.style.display = "none"; }, true);

/* ================= Gráficos SVG ================= */
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function comboChart(el, cats, series, line, o = {}){
  if (!cats.length){ el.innerHTML = `<div class="empty">Sem dados para o filtro selecionado.</div>`; return; }
  // largura = contêiner, mas nunca menos que minBand px por categoria (aí o .chart rola na horizontal)
  const ml = 64, mr = 12, cw = Math.max(el.clientWidth, 280);
  const W = Math.max(cw, ml + mr + cats.length * (o.minBand || 0));
  const H = Math.round(Math.max(300, Math.min(o.height || 460, cw * 0.75)));
  const rotate = o.rotate === "auto" ? (W - ml - mr) / cats.length < 56 : !!o.rotate;
  const m = {t:28, r:mr, b:rotate?70:40, l:ml};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const totals = cats.map((_,i) => series.reduce((s,se) => s + (se.values[i]||0), 0));
  const lineVals = line ? line.values.filter(v => v != null) : [];
  const ymax = niceMax(Math.max(1, ...totals, ...lineVals) * 1.08);
  const y = v => m.t + ih - v/ymax*ih;
  const bw = iw / cats.length, barW = Math.max(4, bw * 0.62);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-size="11" font-family="Segoe UI,Helvetica,Arial,sans-serif">`;
  for (let k=0;k<=5;k++){ const v = ymax*k/5, yy = y(v);
    s += `<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="#eceef1"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end" fill="#6b6f76">${v>=1000?fmtNum1.format(v/1000)+" mil":fmtNum.format(v).replace(/,00$/,"")}</text>`; }
  if (o.yTitle) s += `<text transform="translate(12 ${m.t+ih/2}) rotate(-90)" text-anchor="middle" fill="#6b6f76">${esc(o.yTitle)}</text>`;
  cats.forEach((c,i) => {
    const cx = m.l + bw*i + bw/2; let acc = 0;
    series.forEach(se => { const v = se.values[i]||0; if (!v) return;
      const y0 = y(acc), y1 = y(acc+v); acc += v; const h = y0 - y1;
      s += `<rect x="${cx-barW/2}" y="${y1}" width="${barW}" height="${Math.max(h,0.5)}" fill="${se.color}" data-tip="${esc(`<b>${esc(c)}</b> · ${esc(se.name)}<br>${fmtBRL.format(v)}`)}"/>`;
      if (o.labels && h > 14 && barW > 34) s += `<text x="${cx}" y="${y1+h/2+4}" text-anchor="middle" fill="#fff" font-size="10" pointer-events="none">${fmtNum.format(v)}</text>`;
    });
    if (totals[i] > 0) s += `<text x="${cx}" y="${y(totals[i])-5}" text-anchor="middle" font-weight="600" fill="#242424" font-size="${barW>40?11:9}">${fmtNum1.format(totals[i])}</text>`;
    const lbl = esc(c);
    s += rotate ? `<text transform="translate(${cx+3} ${m.t+ih+10}) rotate(-50)" text-anchor="end" fill="#444">${lbl}</text>`
                  : `<text x="${cx}" y="${m.t+ih+16}" text-anchor="middle" fill="#444">${lbl}</text>`;
  });
  if (line){
    // linha em degrau centralizada (como no relatório original)
    let d = ""; let prev = null;
    cats.forEach((c,i) => { const v = line.values[i]; if (v == null){ prev = null; return; }
      const x0 = m.l + bw*i, x1 = x0 + bw, yy = y(v);
      d += (prev == null ? `M${x0},${yy}` : `L${x0},${yy}`) + `L${x1},${yy}`; prev = v;
      s += `<rect x="${x0}" y="${yy-6}" width="${bw}" height="12" fill="transparent" data-tip="${esc(`<b>${esc(c)}</b> · ${esc(line.name)}<br>${fmtBRL.format(v)}`)}"/>`;
    });
    s += `<path d="${d}" fill="none" stroke="${line.color||"#242424"}" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round" pointer-events="none"/>`;
  }
  s += `<line x1="${m.l}" x2="${W-m.r}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="#999"/></svg>`;
  el.innerHTML = s;
}
function legend(el, series, line){
  el.innerHTML = series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join("") +
    (line ? `<span><i class="dash"></i>${esc(line.name)}</span>` : "");
}
function gauge(el, value, max, o = {}){
  const W = 360, H = 230, cx = W/2, cy = 180, R = 140, r = 90;
  const mx = max > 0 ? max : Math.max(value, 1) * 2;
  const f = Math.max(0, Math.min(1, value / mx));
  const pt = (a, rad) => [cx - rad*Math.cos(a), cy - rad*Math.sin(a)];
  const arc = (a0, a1, col) => { const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r); const lg = a1-a0 > Math.PI ? 1 : 0;
    return `<path d="M${x0},${y0} A${R},${R} 0 ${lg} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${lg} 0 ${x3},${y3} Z" fill="${col}"/>`; };
  const over = max > 0 && value > max;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Helvetica,Arial,sans-serif" class="fluid">`;
  s += arc(0, Math.PI, "#e8eaed");
  if (f > 0) s += arc(0, Math.PI*f, over ? "#c4314b" : (o.color || "#00A41B"));
  s += `<text x="${cx}" y="${cy-22}" text-anchor="middle" font-size="26" font-weight="600" fill="#242424">${o.fmt ? o.fmt(value) : value}</text>`;
  if (max > 0) s += `<text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="14" fill="${over?"#c4314b":"#6b6f76"}">${fmtPct.format(value/max)} do limite</text>`;
  s += `<text x="${cx-R+(R-r)/2}" y="${cy+20}" text-anchor="middle" font-size="12" fill="#6b6f76">0</text>`;
  if (max > 0) s += `<text x="${cx+R-(R-r)/2}" y="${cy+20}" text-anchor="middle" font-size="12" fill="#6b6f76">${o.fmt ? o.fmt(max) : max}</text>`;
  if (o.sub) s += `<text x="${cx}" y="${cy+42}" text-anchor="middle" font-size="12" fill="#6b6f76">${esc(o.sub)}</text>`;
  el.innerHTML = s + `</svg>`;
}
function pie(el, items){
  const tot = items.reduce((a,b) => a + b.value, 0);
  if (!tot){ el.innerHTML = `<div class="empty">Sem dados.</div>`; return; }
  const W = 360, H = 260, cx = 180, cy = 130, R = 110;
  let a = -Math.PI/2, s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Helvetica,Arial,sans-serif" class="fluid">`;
  for (const it of items){
    const f = it.value/tot, a1 = a + f*2*Math.PI, tipTxt = `<b>${esc(it.name)}</b><br>${fmtBRL.format(it.value)} (${fmtPct.format(f)})`;
    if (f >= 0.9999) s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${it.color}" data-tip="${esc(tipTxt)}"/>`;
    else { const [x0,y0] = [cx+R*Math.cos(a), cy+R*Math.sin(a)], [x1,y1] = [cx+R*Math.cos(a1), cy+R*Math.sin(a1)];
      s += `<path d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 ${f>0.5?1:0} 1 ${x1},${y1} Z" fill="${it.color}" stroke="#fff" stroke-width="1.5" data-tip="${esc(tipTxt)}"/>`; }
    if (f > 0.06){ const am = (a+a1)/2; s += `<text x="${cx+R*0.62*Math.cos(am)}" y="${cy+R*0.62*Math.sin(am)+4}" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" pointer-events="none">${Math.round(f*100)}%</text>`; }
    a = a1;
  }
  el.innerHTML = s + `</svg>`;
}

/* ================= Tabelas ================= */
// cols: [{k, t, cls, fmt(v,row), cellCls(v,row), sortVal(row)}]
function table(el, id, cols, rows, o = {}){
  const st = S.sort[id] || o.defSort || null;
  let data = rows.slice();
  if (st){ const c = cols.find(c => c.k === st.k);
    if (c){ const gv = c.sortVal || (r => r[c.k]);
      data.sort((a,b) => { const x = gv(a), y = gv(b); const r = (typeof x === "number" && typeof y === "number") ? x - y : String(x??"").localeCompare(String(y??""),"pt-BR",{numeric:true}); return st.asc ? r : -r; }); } }
  if (o.secondarySort && !S.sort[id]) data = o.secondarySort(data);
  if (o.limit) data = data.slice(0, o.limit);
  let h = `<table><thead><tr>` + cols.map(c => `<th class="${c.cls||""} ${st&&st.k===c.k?"sorted"+(st.asc?" asc":""):""}" data-k="${esc(c.k)}">${esc(c.t)}</th>`).join("") + `</tr></thead><tbody>`;
  if (!data.length) h += `<tr><td colspan="${cols.length}" class="empty">Sem dados para o filtro selecionado.</td></tr>`;
  for (const r of data) h += `<tr>` + cols.map(c => { const v = r[c.k]; return `<td class="${c.cls||""} ${c.cellCls?c.cellCls(v,r):""}">${c.fmt ? c.fmt(v,r) : esc(v)}</td>`; }).join("") + `</tr>`;
  if (o.total) h += `<tr class="total">` + cols.map(c => `<td class="${c.cls||""} ${c.totCls||""}">${o.total[c.k] ?? ""}</td>`).join("") + `</tr>`;
  el.innerHTML = h + `</tbody></table>`;
  el.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k, cur = S.sort[id] || o.defSort; S.sort[id] = {k, asc: cur && cur.k === k ? !cur.asc : true}; render();
  });
}
const brl = v => v == null ? "" : fmtBRL.format(v);
const dBR = v => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v||""); return m ? `${m[3]}/${m[2]}/${m[1]}` : esc(v); };

/* ================= Slicers ================= */
function monthSlicer(el, sel, onPick, allowNone){
  // ordem cronológica (esquerda → direita); o ano já vem do seletor, então só o nome do mês
  const ms = monthsOfYear();
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const h = (allowNone ? `<button class="${sel == null ? "on" : ""}" data-v="">Todos</button>` : "") +
    ms.map(ym => `<button class="${ym===sel?"on":""}" data-v="${ym}" title="${ymLong(ym)}">${cap(MESES[ym%100-1])}</button>`).join("");
  el.innerHTML = ms.length ? h : `<span class="muted">Sem meses com dados em ${S.year}.</span>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => { const v = b.dataset.v ? +b.dataset.v : null; onPick(allowNone && v === sel ? null : v); render(); });
  // mantém o mês selecionado visível (centralizado) na faixa
  const center = () => { const on = el.querySelector("button.on");
    if (on && el.scrollWidth > el.clientWidth) el.scrollLeft = on.offsetLeft - (el.clientWidth - on.offsetWidth) / 2; };
  center();
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(center);  // larguras mudam após carregar a fonte
}
function udSlicer(el, isOn, onPick, uds){
  el.innerHTML = uds.map(u => `<button class="${isOn(u)?"on":""}" data-v="${esc(u)}">${esc(u)}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { onPick(b.dataset.v); render(); });
}

/* ================= Páginas ================= */
function renderGasto(){
  monthSlicer(document.getElementById("slGasto"), S.mGasto, v => S.mGasto = v);
  const rows = yearRows().filter(r => r.ym === S.mGasto);
  // categorias = todas as UDs (como dataref_ud.ud), ordenadas pelo limite desc
  const uds = S.uds.slice().sort((a,b) => (lim(b)??-1) - (lim(a)??-1) || a.localeCompare(b));
  const tipos = S.tipos.filter(t => rows.some(r => r.tipo === t));
  const series = tipos.map(t => { const m = sumBy(rows.filter(r => r.tipo === t), r => r.ud); return {name:t, color:tipoColor(t), values: uds.map(u => m.get(u)||0)}; });
  const line = S.limits.size ? {name:"Limite mensal", color:"#242424", values: uds.map(u => lim(u) ?? null)} : null;
  const el = document.getElementById("chGasto");
  comboChart(el, S.mGasto ? uds : [], series, line, {labels:true, rotate:"auto", minBand:26, height:500});
  legend(document.getElementById("lgGasto"), series, line);
}
function renderValores(){
  const used = new Set(yearRows().map(r => r.ud));
  const uds = S.uds.filter(u => used.has(u) || S.limits.has(u));
  udSlicer(document.getElementById("slValoresUd"), u => S.udValores === u, u => S.udValores = S.udValores === u ? null : u, uds);
  const rows = yearRows().filter(r => !S.udValores || r.ud === S.udValores);
  const ms = monthsOfYear();
  const tipos = S.tipos.filter(t => rows.some(r => r.tipo === t));
  const series = tipos.map(t => { const m = sumBy(rows.filter(r => r.tipo === t), r => r.ym); return {name:t, color:tipoColor(t), values: ms.map(x => m.get(x)||0)}; });
  let limVal = null;
  if (S.limits.size) limVal = S.udValores ? (lim(S.udValores) ?? null) : [...S.limits.values()].reduce((a,b) => a + (b||0), 0);
  const line = limVal != null ? {name: S.udValores ? `Limite ${S.udValores}` : "Limite (soma das UDs)", color:"#242424", values: ms.map(() => limVal)} : null;
  comboChart(document.getElementById("chValores"), ms.map(ymLabel), series, line, {labels:true, yTitle:"Valor (R$)", height:520, rotate:"auto", minBand:44});
  legend(document.getElementById("lgValores"), series, line);
}
function renderDesc(){
  monthSlicer(document.getElementById("slDesc"), S.mDesc, v => S.mDesc = v, true);
  const yr = yearRows();
  const uds = [...new Set(yr.map(r => r.ud))].sort();
  udSlicer(document.getElementById("slDescUd"), u => S.udDesc.has(u), u => { S.udDesc.has(u) ? S.udDesc.delete(u) : S.udDesc.add(u); }, uds);
  const rows = yr.filter(r => (!S.mDesc || r.ym === S.mDesc) && (!S.udDesc.size || S.udDesc.has(r.ud)));
  const tot = rows.reduce((a,b) => a + b.valor, 0);
  table(document.getElementById("tbDesc"), "desc", [
    {k:"data", t:"data", fmt:dBR, cls:"nowrap"},
    {k:"ym", t:"Competência", fmt:v => v ? ymLong(v) : "", cls:"nowrap"},
    {k:"ud", t:"UD"}, {k:"cto", t:"CTO", cls:"nowrap"},
    {k:"descricao_sucinta", t:"Descrição Sucinta"},
    {k:"valor", t:"Valor (R$)", cls:"num", fmt:brl}
  ], rows, {defSort:{k:"data", asc:false}, total:{data:"Total", valor: brl(tot), cto: rows.length + " lançamentos"}});
}
function overList(){
  // agrupa por ano/mês/UD (todas as competências do ano selecionado) e mantém só valor > limite
  const m = new Map();
  for (const r of yearRows()){ const k = r.ym + "|" + r.ud; const o = m.get(k) || {ym:r.ym, y:r.y, mes:r.m, ud:r.ud, valor:0}; o.valor += r.valor; m.set(k, o); }
  const out = [];
  for (const o of m.values()){ const L = lim(o.ud); if (L != null && L > 0 && o.valor > L) out.push({...o, limite:L, uso:o.valor/L}); }
  return out;
}
function renderLimite(){
  const list = overList();
  table(document.getElementById("tbLista"), "lista", [
    {k:"y", t:"Ano"}, {k:"mes", t:"Mês", fmt:(v) => MESES[v-1][0].toUpperCase()+MESES[v-1].slice(1), sortVal:r => r.mes},
    {k:"ud", t:"UD"},
    {k:"uso", t:"Uso (%)", cls:"ctr", cellCls:() => "uso", fmt:v => fmtPct.format(v)},
    {k:"valor", t:"Valor", cls:"num", fmt:brl}, {k:"limite", t:"Limite Mensal", cls:"num", fmt:brl}
  ], list, {defSort:{k:"ym", asc:true}, secondarySort: d => d.sort((a,b) => a.ym - b.ym || a.ud.localeCompare(b.ud))});
  const cnt = new Map(); for (const o of list) cnt.set(o.ud, (cnt.get(o.ud)||0) + 1);
  const res = [...cnt].map(([ud,n]) => ({ano:S.year, ud, n}));
  table(document.getElementById("tbResumo"), "resumo", [
    {k:"ano", t:"Ano"}, {k:"ud", t:"UD"}, {k:"n", t:"Meses Acima do Limite", cls:"ctr"}
  ], res, {secondarySort: d => d.sort((a,b) => b.n - a.n || a.ud.localeCompare(b.ud))});
}
function renderDados(){
  const q = norm(document.getElementById("qDados").value);
  const cols = ["run_id","data","ud","cto","tipo","descricao_sucinta","valor","cnpj","razao_social"];
  let rows = yearRows();
  if (q) rows = rows.filter(r => norm(cols.map(c => r[c]).join(" ") + " " + r.competencia + " " + r.nota_fiscal_num + " " + r.num_daffc).includes(q));
  document.getElementById("cntDados").textContent = `${rows.length} linhas · ${fmtBRL.format(rows.reduce((a,b) => a + b.valor, 0))}`;
  table(document.getElementById("tbDados"), "dados", [
    {k:"run_id", t:"run_id", cls:"num", sortVal:r => +r.run_id || 0}, {k:"data", t:"data", fmt:dBR, cls:"nowrap"},
    {k:"ud", t:"ud"}, {k:"cto", t:"cto", cls:"nowrap"}, {k:"tipo", t:"tipo"},
    {k:"descricao_sucinta", t:"descricao_sucinta"}, {k:"valor", t:"valor", cls:"num", fmt:v => fmtNum.format(v)},
    {k:"cnpj", t:"cnpj", cls:"nowrap", cellCls:v => (v == null || String(v).trim() === "") ? "warn" : ""},
    {k:"razao_social", t:"razao_social"}
  ], rows, {defSort:{k:"data", asc:false}});
}
function renderMatriz(){
  // meses do ano: do primeiro mês com dados até dezembro (o relatório 2026 mostrava abr/26 … dez/26)
  const ms = monthsOfYear(); const first = ms.length ? ms[0] % 100 : 1;
  const months = []; for (let mm = first; mm <= 12; mm++) months.push(S.year*100 + mm);
  const yr = yearRows(); const agg = sumBy(yr, r => r.ud + "|" + r.ym); const tud = sumBy(yr, r => r.ud);
  const used = new Set(yr.map(r => r.ud));
  const uds = S.uds.filter(u => used.has(u) || S.limits.has(u));
  const rows = uds.map(u => { const o = {ud:u, limite: lim(u) ?? null, total: tud.get(u) || 0}; months.forEach(ym => o["m"+ym] = agg.get(u+"|"+ym) || 0); return o; });
  const cols = [{k:"ud", t:"UD", cls:"ctr"}, {k:"limite", t:"Limite Mensal", cls:"num", cellCls:() => "lim", fmt:v => v == null ? "" : fmtNum.format(v)}]
    .concat(months.map(ym => ({k:"m"+ym, t:ymLabel(ym), cls:"num", fmt:v => brl(v), cellCls:(v,r) => r.limite != null && v > r.limite ? "over" : ""})))
    .concat([{k:"total", t:"TOTAL (R$)", cls:"num", cellCls:() => "tot", fmt:brl, totCls:"tot"}]);
  const total = {ud:"Total", limite: fmtNum.format(rows.reduce((a,b) => a + (b.limite||0), 0)), total: brl(rows.reduce((a,b) => a + b.total, 0))};
  months.forEach(ym => total["m"+ym] = brl(rows.reduce((a,b) => a + b["m"+ym], 0)));
  table(document.getElementById("tbMatriz"), "matriz", cols, rows, {defSort:{k:"ud", asc:true}, total});
}
function renderPainel(){
  monthSlicer(document.getElementById("slPainel"), S.mPainel, v => S.mPainel = v);
  const rows = yearRows().filter(r => r.ym === S.mPainel);
  const tot = rows.reduce((a,b) => a + b.valor, 0);
  const limTot = [...S.limits.values()].reduce((a,b) => a + (b||0), 0);
  gauge(document.getElementById("chGauge"), tot, limTot, {fmt:v => fmtBRL.format(v), sub: S.mPainel ? ymLong(S.mPainel) : ""});
  const nUd = new Set(rows.map(r => r.ud)).size;
  document.getElementById("chGauge2").innerHTML = `<div style="text-align:center;padding:40px 0"><div style="font-size:52px;font-weight:600">${rows.length}</div><div class="muted">CTOs em ${S.mPainel ? ymLong(S.mPainel) : "—"}</div><div style="margin-top:18px;font-size:20px;font-weight:600">${nUd}</div><div class="muted">UDs com lançamento</div></div>`;
  const m = sumBy(rows, r => r.tipo);
  const items = [...m].map(([name,value]) => ({name, value, color:tipoColor(name)})).sort((a,b) => b.value - a.value);
  pie(document.getElementById("chPie"), items);
  document.getElementById("lgPie").innerHTML = items.map(i => `<span><i style="background:${i.color}"></i>${esc(i.name)}: ${fmtBRL.format(i.value)}</span>`).join("");
}
const RENDER = {"pg-gasto":renderGasto, "pg-valores":renderValores, "pg-desc":renderDesc, "pg-limite":renderLimite, "pg-dados":renderDados, "pg-matriz":renderMatriz, "pg-painel":renderPainel};
function render(){
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === S.page));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.p === S.page));
  if (S.rows.length || S.limits.size) RENDER[S.page]();
}

/* ================= Inicialização ================= */
(function init(){
  const tabs = document.getElementById("tabs");
  if (RENDER[location.hash.slice(1)]) S.page = location.hash.slice(1);  // link direto para a aba: …html#pg-painel
  if (!RENDER[S.page]) S.page = "pg-gasto";
  addEventListener("hashchange", () => { const p = location.hash.slice(1); if (RENDER[p] && p !== S.page){ S.page = p; render(); } });
  tabs.innerHTML = [...document.querySelectorAll(".page")].map(p => `<button data-p="${p.id}">${esc(p.dataset.title)}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => { S.page = b.dataset.p; try{ localStorage.setItem("ffcto_page", S.page); }catch(e){} history.replaceState(null, "", "#" + S.page); render(); });
  document.getElementById("yearSel").onchange = e => { S.year = +e.target.value; S.udDesc.clear(); resetMonths(); render(); };
  document.getElementById("btnReload").onclick = load;
  document.getElementById("btnCfg").onclick = () => document.getElementById("cfg").classList.toggle("show");
  document.getElementById("cfgApi").value = cfgGet("api");
  document.getElementById("cfgDb").value = cfgGet("db");
  document.getElementById("cfgSave").onclick = () => { cfgSet("api", document.getElementById("cfgApi").value.trim()); cfgSet("db", document.getElementById("cfgDb").value.trim()); load(); };
  let fileCto = null, fileUd = null;
  const readFile = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(parseCSV(r.result)); r.onerror = ko; r.readAsText(f, "utf-8"); });
  const fromFiles = async () => { if (!fileCto) return; ingest(fileCto, fileUd || []); setStatus(`${S.rows.length} lançamentos carregados de arquivo` + (fileUd ? "" : " · carregue dataref_ud para ver limites")); };
  document.getElementById("fileCto").onchange = async e => { if (e.target.files[0]){ fileCto = await readFile(e.target.files[0]); fromFiles(); } };
  document.getElementById("fileUd").onchange = async e => { if (e.target.files[0]){ fileUd = await readFile(e.target.files[0]); fromFiles(); } };
  let qT; document.getElementById("qDados").oninput = () => { clearTimeout(qT); qT = setTimeout(render, 150); };
  let rT, lastW = innerWidth; addEventListener("resize", () => { setHeaderH(); if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rT); rT = setTimeout(render, 150); });
  setHeaderH();
  render(); load();
})();
</script>
